services:
  watchtower:
    image: nickfedor/watchtower
    environment:
      -  WATCHTOWER_POLL_INTERVAL=60 # Poll every 60 seconds
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: watchtower
  
  node-app:
    image: serbrio/devops-docker-3-own-pipeline
    build: ./
    ports:
      - 8080:8080
